<section class="location" id="location">
  <div class="container location__inner">
    <div class="location__head">
      <div class="location__intro">
        <p class="location__tagline text-size-tagline">Location</p>
        <div class="location__content">
          <h2 class="location__title text-size-xl">How to find us</h2>
          <p class="location__text text-size-medium">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse
            varius enim in eros elementum tristique.
          </p>
        </div>
      </div>

      <ul class="location__list">
        <li class="location__item">
          <svg class="location__icon" width="24" height="24" aria-hidden="true">
            <use href="./img/icons.svg#icon-envelope"></use>
          </svg>
          <div class="location__info">
            <p class="location__label text-size-regular-semibold">Email</p>
            <a class="location__value" href="mailto:hello@booksy.com"
              >hello@booksy.com</a
            >
          </div>
        </li>

        <li class="location__item">
          <svg class="location__icon" width="24" height="24" aria-hidden="true">
            <use href="./img/icons.svg#icon-phone"></use>
          </svg>
          <div class="location__info">
            <p class="location__label text-size-regular-semibold">Phone</p>
            <a class="location__value" href="tel:+612413043012"
              >+61 (241) 304-3012</a
            >
          </div>
        </li>

        <li class="location__item">
          <svg class="location__icon" width="24" height="24" aria-hidden="true">
            <use href="./img/icons.svg#icon-map"></use>
          </svg>
          <div class="location__info">
            <p class="location__label text-size-regular-semibold">Office</p>
            <address class="location__address">
              123 Books St, Sydney NSW 2000 AU
            </address>
          </div>
        </li>
      </ul>
    </div>

    <div class="location__map">
      <iframe
        class="location__frame"
        title="Booksy bookstore on Google Maps: 123 Books St, Sydney NSW 2000 AU"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3318.07752196243!2d150.85566711171225!3d-33.73281147316755!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6b129be22dc8ad15%3A0xf31fa2c6393900ac!2zQm9va3MgU3QsIERlYW4gUGFyayBOU1cgMjc2MSwg0JDQstGB0YLRgNCw0LvRltGP!5e0!3m2!1suk!2sua!4v1795360824222!5m2!1suk!2sua"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen=""
      ></iframe>
    </div>
  </div>
</section>
